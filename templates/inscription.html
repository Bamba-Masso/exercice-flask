<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <main class="container py-5" style="max-width: 520px;">
        <section class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 text-center mb-4">Créer un compte</h1>

                {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
                {% endfor %}
                {% endwith %}

                <form method="post" action="{{ url_for('traitement_inscription') }}">
                    <div class="mb-3">
                        <label for="nom_complet" class="form-label">Nom complet</label>
                        <input type="text" id="nom_complet" name="nom_complet" class="form-control" autocomplete="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Adresse e-mail</label>
                        <input type="email" id="email" name="email" class="form-control" autocomplete="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="mot_de_passe" class="form-label">Mot de passe</label>
                        <input type="password" id="mot_de_passe" name="mot_de_passe" class="form-control" minlength="4"
                            autocomplete="new-password" required>
                    </div>
                    <div class="mb-4">
                        <label for="confirmation" class="form-label">Confirmer le mot de passe</label>
                        <input type="password" id="mot_de_passe_conf" name="mot_de_passe_conf" class="form-control" minlength="4"
                            autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">S'inscrire</button>
                </form>

                <p class="text-center mt-3 mb-0">
                    Déjà inscrit ?
                    <a href="{{ url_for('connexion') }}">Se connecter</a>
                </p>
            </div>
        </section>
    </main>
</body>

</html>
